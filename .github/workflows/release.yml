name: Release

# Pushing a tag such as v1.2.0 builds the esp32cam firmware and publishes it as a GitHub Release.
# CI never flashes a device: OTA needs OTA_PASSWORD from a machine on the same LAN as the camera.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: python -m pip install platformio
      - name: Host unit tests (no hardware)
        run: pio test -e native
      - name: Build the esp32cam firmware
        run: |
          cp src/secrets.h.example src/secrets.h
          pio run -e esp32cam
      - name: Collect release files and checksums
        run: |
          mkdir -p dist
          cp .pio/build/esp32cam/firmware.bin .pio/build/esp32cam/partitions.bin .pio/build/esp32cam/bootloader.bin dist/
          cd dist
          sha256sum firmware.bin partitions.bin bootloader.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/firmware.bin dist/partitions.bin dist/bootloader.bin dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Firmware $TAG" \
            --generate-notes \
            --verify-tag
