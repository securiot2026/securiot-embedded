; PlatformIO project configuration for the SecurIoT ESP32-CAM (AI-Thinker) firmware.
; See docs/BRINGUP.md for how to build and flash this project.

[platformio]
; Without default_envs a bare `pio run` would also try to compile src/ for the
; host "native" environment below and fail.
default_envs = esp32cam

[env:esp32cam]
; The firmware uses the Arduino-ESP32 core 3.x LEDC API
; (ledcAttach(pin, freq, res)), which core 2.x does not have. The official
; PlatformIO "espressif32" platform has been stuck on core 2.0.17 for a long
; time, so this pins to the community "pioarduino" fork instead, which
; tracks current Arduino-ESP32 core 3.x releases.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32cam
framework = arduino

; The board default (huge_app.csv) has a single 3 MB app slot and no OTA slot.
; min_spiffs.csv from the framework has two 1.875 MB slots (app0 at 0x10000 and
; app1 at 0x1F0000, 0x1E0000 each), keeps nvs at 0x9000 size 0x5000 and otadata
; at 0xe000, and leaves a 128 KB spiffs partition the firmware does not use. The
; table is written by a USB flash only, OTA cannot change it, and the saved
; config may be lost once (re-provision through the portal).
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed = 115200

; ArduinoJson: parses the Edge API's /frames JSON response.
; ESP32Servo: PWM servo control on the ESP32's LEDC peripheral, the core
; Arduino "Servo" library targets AVR timers and does not work on ESP32.
; Adafruit NeoPixel: drives the single WS2812 status LED on GPIO4.
; WiFi.h, HTTPClient.h, esp_camera.h, ESPmDNS.h and ArduinoOTA.h ship with the
; espressif32 platform's Arduino core, no lib_deps entry needed for those.
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    madhephaestus/ESP32Servo@^3.0.0
    adafruit/Adafruit NeoPixel@^1.12.3
    ; Captive portal provisioning (Phase 6): WiFi-only config AP + portal.
    ; Do NOT use me-no-dev/ESPAsyncWebServer (unmaintained), MycilaESPConnect
    ; is built and tested against the ESP32Async fork specifically.
    mathieucarbou/MycilaESPConnect@^10.6.2
    ESP32Async/AsyncTCP@^3.5.0
    ESP32Async/ESPAsyncWebServer@^3.12.0

build_flags =
    ; PSRAM is required on the AI-Thinker ESP32-CAM for stable JPEG capture
    ; at frame sizes above QVGA (see docs/PINOUT.md).
    -DBOARD_HAS_PSRAM

; Same firmware, uploaded over WiFi (ArduinoOTA) instead of USB. Needs the
; one-time USB flash first (partition table), see docs/BRINGUP.md section 3e.
; Export SECURIOT_OTA_PASSWORD with the same value as OTA_PASSWORD in
; src/secrets.h before uploading, and never write the value in this file. An
; unset variable becomes an empty `--auth=` and the device refuses the upload.
; Use `--upload-port <ip>` when mDNS does not resolve securiot-cam.local. Avoid
; spaces and shell special characters in the password.
[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = securiot-cam.local
upload_flags = --auth=${sysenv.SECURIOT_OTA_PASSWORD}

; Host-side unit tests only (`pio test -e native`). Never flashed; src/ is not
; built here, tests include the Arduino-free headers directly via -Isrc.
[env:native]
platform = native
test_framework = unity
; Same pinned ArduinoJson as the firmware env, for frame_response.h tests.
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -std=gnu++17
    -Isrc
